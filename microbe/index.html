<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>微生物AI鉴定站 | BioBloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #fbf8f0;
    --navy: #08275f;
    --green: #1e6b2d;
    --leaf: #6f8f5d;
    --line: #d8dece;
    --ink: #203128;
    --gold: #c28a2d;
  }
  body {
    font-family: "STKaiti", "KaiTi", "Songti SC", "Noto Serif SC", serif;
    background:
      radial-gradient(circle at 14% 12%, rgba(43, 145, 211, 0.08) 0 8%, transparent 18%),
      radial-gradient(circle at 86% 18%, rgba(42, 111, 38, 0.08) 0 9%, transparent 20%),
      linear-gradient(135deg, rgba(255,255,255,0.88), rgba(250,245,232,0.84)),
      var(--paper);
    min-height: 100vh;
    color: var(--ink);
    overflow-x: hidden;
  }
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: auto auto 0 0;
    width: 360px;
    height: 220px;
    pointer-events: none;
    opacity: 0.62;
    background:
      radial-gradient(ellipse at 20% 78%, rgba(89, 126, 70, 0.22) 0 11%, transparent 12%),
      radial-gradient(ellipse at 34% 66%, rgba(89, 126, 70, 0.25) 0 10%, transparent 11%),
      radial-gradient(ellipse at 50% 76%, rgba(89, 126, 70, 0.2) 0 10%, transparent 11%),
      linear-gradient(28deg, transparent 0 47%, rgba(67, 103, 47, 0.46) 48% 50%, transparent 51%);
    transform: rotate(-8deg);
  }
  body::after {
    inset: 0 0 auto auto;
    transform: rotate(188deg);
  }
  .page {
    width: 100%;
    min-height: 100vh;
    position: relative;
    padding: 24px 28px;
    display: grid;
    place-items: start center;
  }
  .microbe-strip {
    position: absolute;
    top: 24px;
    left: 36px;
    right: 36px;
    height: 92px;
    pointer-events: none;
  }
  .microbe {
    position: absolute;
    border-radius: 999px;
    border: 3px solid currentColor;
    background: color-mix(in srgb, currentColor 22%, transparent);
    box-shadow: 0 0 0 7px color-mix(in srgb, currentColor 12%, transparent);
    opacity: 0.86;
  }
  .microbe::before,
  .microbe::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: inherit;
    border: 1px dashed currentColor;
    opacity: 0.45;
  }
  .microbe::after {
    inset: 36% -22px auto;
    height: 2px;
    background: currentColor;
    border: 0;
    transform: rotate(20deg);
  }
  .m1 { color: #5c8b2c; width: 42px; height: 26px; left: 3%; top: 20px; transform: rotate(38deg); }
  .m2 { color: #7e3bb2; width: 44px; height: 30px; left: 14%; top: 16px; transform: rotate(-24deg); }
  .m3 { color: #1880b7; width: 46px; height: 46px; left: 36%; top: 14px; }
  .m4 { color: #2f9dc4; width: 18px; height: 18px; left: 27%; top: 38px; }
  .m5 { color: #5e52de; width: 20px; height: 20px; left: 68%; top: 26px; }
  .m6 { color: #8fb372; width: 30px; height: 22px; left: 76%; top: 34px; transform: rotate(-32deg); }

  .layout {
    width: min(1240px, 100%);
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    align-items: start;
    position: relative;
    z-index: 1;
    min-width: 0;
    max-width: 100%;
  }
  .hero {
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding-top: 76px;
    min-width: 0;
  }
  .school-line {
    color: var(--navy);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 2.7vw, 34px);
    letter-spacing: 0;
    line-height: 1.05;
    text-shadow: 0 3px 0 rgba(8, 39, 95, 0.08);
  }
  h1 {
    color: var(--green);
    font-size: clamp(24px, 2.8vw, 34px);
    line-height: 1.12;
    font-weight: 900;
    margin: 10px 0 8px;
    text-shadow:
      0 2px 0 rgba(255, 255, 255, 0.95),
      0 8px 12px rgba(20, 91, 36, 0.18);
    overflow-wrap: anywhere;
  }
  .question {
    color: var(--navy);
    font-size: clamp(20px, 2.4vw, 30px);
    line-height: 1.1;
    font-weight: 800;
    margin-bottom: 12px;
  }
  .brush {
    align-self: center;
    color: #fff;
    background:
      linear-gradient(90deg, transparent 0 4%, rgba(28, 104, 45, 0.96) 8% 90%, transparent 98%),
      repeating-linear-gradient(-2deg, rgba(255,255,255,0.14) 0 4px, transparent 5px 12px);
    padding: 7px 26px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    transform: rotate(-1deg);
    filter: drop-shadow(0 4px 5px rgba(37, 95, 38, 0.18));
  }
  .teacher {
    color: var(--navy);
    font-size: 18px;
    font-weight: 800;
    margin-top: 18px;
    padding-left: 0;
  }
  .tool-panel {
    position: relative;
    background: rgba(255, 252, 244, 0.9);
    border: 1px solid rgba(120, 143, 102, 0.34);
    border-radius: 8px;
    padding: 22px;
    box-shadow: 0 18px 40px rgba(32, 49, 40, 0.14);
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(300px, 0.82fr) minmax(420px, 1.18fr);
    gap: 18px;
    align-items: start;
  }
  .tool-panel::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(34, 91, 38, 0.18);
    border-radius: 8px;
    pointer-events: none;
  }
  .panel-title {
    position: relative;
    z-index: 1;
    display: inline-block;
    background: #fff;
    border: 1px solid #cbd5c5;
    color: var(--green);
    box-shadow: 0 4px 10px rgba(18, 50, 30, 0.1);
    padding: 8px 18px;
    font-size: 20px;
    font-weight: 900;
    margin: 0 0 14px 12px;
    grid-column: 1 / -1;
    justify-self: start;
  }
  .input-pane {
    position: relative;
    z-index: 1;
    min-width: 0;
  }
  .tool-panel:has(.result-area:empty) .input-pane {
    grid-column: 1 / -1;
    width: 100%;
    max-width: 500px;
    justify-self: center;
  }
  .preview-area {
    position: relative;
    z-index: 1;
    width: 100%;
    aspect-ratio: 1;
    border: 2px dashed rgba(30, 107, 45, 0.42);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.9), rgba(239,247,229,0.72)),
      repeating-linear-gradient(45deg, rgba(8, 39, 95, 0.04) 0 1px, transparent 1px 16px);
    box-shadow: inset 0 0 0 8px rgba(255,255,255,0.56);
  }
  .preview-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview-placeholder {
    color: #637660;
    font-size: 16px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(120, 143, 102, 0.35);
    padding: 10px 18px;
    border-radius: 8px;
  }

  .btn-row {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px 0;
    border: 1px solid rgba(13, 54, 95, 0.12);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .btn:active { opacity: 0.75; transform: translateY(1px); }
  .btn-camera { background: var(--navy); color: #fff; }
  .btn-gallery { background: var(--green); color: #fff; }
  .btn-recognize {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #1d6d31, #2f8a3d);
    color: #fff;
    border: 1px solid rgba(28, 90, 42, 0.3);
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
    box-shadow: 0 8px 18px rgba(30, 107, 45, 0.2);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .btn-recognize:active { opacity: 0.7; }
  .btn-recognize:disabled {
    background: #b9c4b3;
    box-shadow: none;
    cursor: not-allowed;
  }

  .result-area {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.88);
    border: 1px solid #d9e0cf;
    border-radius: 8px;
    padding: 12px;
    min-height: 100%;
    font-size: 14px;
    color: #394640;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .result-area:empty {
    display: none;
  }

  .result-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }
  .candidate-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .feature-item {
    background: #fff;
    border: 1px solid #dce4d4;
    border-radius: 8px;
    padding: 9px 10px;
    box-shadow: 0 2px 8px rgba(25, 55, 37, 0.05);
  }
  .feature-label {
    display: block;
    color: #75827c;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .feature-value {
    color: #26302c;
    font-size: 14px;
  }
  .candidate-card {
    background: #fff;
    border: 1px solid #dce4d4;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    box-shadow: 0 3px 10px rgba(25, 55, 37, 0.06);
  }
  .candidate-grid .candidate-card {
    margin-top: 0;
  }
  .candidate-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .candidate-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .likelihood {
    flex: 0 0 auto;
    color: var(--green);
    background: #e8f6ef;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 700;
  }
  .candidate-tags {
    display: flex;
    flex: 0 0 auto;
    gap: 6px;
    align-items: center;
  }
  .type-tag {
    color: var(--navy);
    background: #eef3fb;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 700;
  }
  .reason-list {
    margin: 0;
    padding-left: 18px;
    color: #4b5752;
  }
  .reason-list li {
    margin: 2px 0;
  }
  .caveat {
    margin-top: 6px;
    color: #8a6330;
    font-size: 13px;
  }
  .candidate-section-label {
    margin: 7px 0 4px;
    color: #75827c;
    font-size: 12px;
    font-weight: 700;
  }
  .model-info {
    margin-top: 12px;
    color: #66756b;
    font-size: 12px;
    text-align: right;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .status-text {
    position: relative;
    z-index: 1;
    color: var(--gold);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proxy-note {
    display: none;
    position: relative;
    z-index: 1;
    margin-bottom: 12px;
    padding: 10px 12px;
    border: 1px solid #e1c38b;
    border-radius: 8px;
    background: rgba(255, 248, 226, 0.9);
    color: #7a5721;
    font-size: 13px;
    line-height: 1.5;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* Hidden file inputs */
  #camera-input, #gallery-input { display: none; }
  @media (max-width: 900px) {
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    .page {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100vw;
      max-width: 100vw;
      padding: 12px 0 20px;
      overflow: hidden;
    }
    .microbe-strip { height: 42px; left: 14px; right: 14px; top: 8px; opacity: 0.68; }
    .microbe { transform: scale(0.72); transform-origin: center; }
    .layout {
      grid-template-columns: 1fr;
      gap: 10px;
      min-width: 0;
      width: min(calc(100vw - 32px), 360px);
      max-width: 360px;
      margin-left: 16px;
      margin-right: 16px;
      transform: none;
      justify-items: center;
    }
    .hero {
      min-height: auto;
      padding-top: 42px;
      align-items: center;
      text-align: center;
    }
    .brush { align-self: center; max-width: 100%; font-size: 12px; padding: 4px 12px; }
    .teacher { margin-top: 6px; padding-left: 0; font-size: 12px; }
    .tool-panel {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      padding: 14px;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      justify-self: center;
      transform: none;
    }
    .tool-panel:has(.result-area:empty) .input-pane { grid-column: auto; width: 100%; }
    .input-pane,
    .preview-area,
    .btn-row,
    .btn-recognize,
    .result-area { max-width: 100%; min-width: 0; }
    .school-line { font-size: 16px; }
    h1 { font-size: 15px; margin: 5px 0 3px; max-width: 100%; }
    .question { font-size: 14px; margin-bottom: 6px; }
    .panel-title { font-size: 17px; padding: 6px 14px; margin-bottom: 4px; }
    .preview-placeholder { font-size: 14px; }
    .feature-grid,
    .candidate-grid { grid-template-columns: 1fr; }
    body::before, body::after { width: 240px; height: 150px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="microbe-strip" aria-hidden="true">
    <span class="microbe m1"></span>
    <span class="microbe m2"></span>
    <span class="microbe m3"></span>
    <span class="microbe m4"></span>
    <span class="microbe m5"></span>
    <span class="microbe m6"></span>
  </div>

  <main class="layout">
    <section class="hero" aria-label="微生物识别主题">
      <div class="school-line">微生物AI鉴定站</div>
      <h1>北京中学本部微生物地图</h1>
      <div class="question">谁与我们同住？</div>
      <div class="brush">科学卫生，健康共处</div>
      <div class="teacher">授课教师：苑笑阳</div>
    </section>

    <section class="tool-panel" aria-label="菌落图片识别">
      <div class="panel-title">图像分析区</div>

      <div class="input-pane">
        <div class="preview-area" id="preview-area">
          <span class="preview-placeholder" id="placeholder">请拍照或选择图片</span>
          <img id="preview-img" style="display:none" alt="preview">
        </div>

        <div class="btn-row">
          <button class="btn btn-camera" id="btn-camera">拍照</button>
          <button class="btn btn-gallery" id="btn-gallery">相册</button>
        </div>

        <input type="file" id="camera-input" accept="image/*" capture="environment">
        <input type="file" id="gallery-input" accept="image/*">

        <button class="btn-recognize" id="btn-recognize" disabled>识别图片</button>

        <div class="status-text" id="status"></div>
        <div class="proxy-note" id="proxy-note"></div>
      </div>
      <div class="result-area" id="result"></div>
    </section>
  </main>
</div>

<script>
function syncVisualViewportWidth() {
  const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  document.documentElement.style.setProperty("--visual-vw", `${width}px`);
}
syncVisualViewportWidth();
window.addEventListener("resize", syncVisualViewportWidth);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncVisualViewportWidth);
}

const cameraInput = document.getElementById("camera-input");
const galleryInput = document.getElementById("gallery-input");
const previewImg = document.getElementById("preview-img");
const placeholder = document.getElementById("placeholder");
const btnRecognize = document.getElementById("btn-recognize");
const statusEl = document.getElementById("status");
const result = document.getElementById("result");
const proxyNote = document.getElementById("proxy-note");
const apiBase = window.location.protocol === "https:" ? "/api/microbe" : "http://39.107.248.175";

let imageDataUrl = null;

function setResultText(text, model) {
  result.textContent = text || "";
  if (text && model) {
    result.textContent += `\n\n使用模型: ${model}`;
  }
}

function showProxyNote(text) {
  proxyNote.textContent = text || "";
  proxyNote.style.display = text ? "block" : "none";
}

function addFeature(container, label, value) {
  const item = document.createElement("div");
  item.className = "feature-item";

  const labelEl = document.createElement("span");
  labelEl.className = "feature-label";
  labelEl.textContent = label;

  const valueEl = document.createElement("span");
  valueEl.className = "feature-value";
  valueEl.textContent = value || "不明确";

  item.appendChild(labelEl);
  item.appendChild(valueEl);
  container.appendChild(item);
}

function addModelInfo(model) {
  const modelInfo = document.createElement("div");
  modelInfo.className = "model-info";
  modelInfo.textContent = `使用模型: ${model || "不明确"}`;
  result.appendChild(modelInfo);
}

function renderResult(data, model) {
  if (!data) {
    setResultText("未识别到有效结果", model);
    return;
  }

  result.innerHTML = "";

  const featureTitle = document.createElement("div");
  featureTitle.className = "result-title";
  featureTitle.textContent = "可见菌落特征";
  result.appendChild(featureTitle);

  const featureGrid = document.createElement("div");
  featureGrid.className = "feature-grid";
  addFeature(featureGrid, "数量", data.count);
  addFeature(featureGrid, "颜色", data.features && data.features.color);
  addFeature(featureGrid, "形状", data.features && data.features.shape);
  addFeature(featureGrid, "质地", data.features && data.features.texture);
  result.appendChild(featureGrid);

  const candidates = Array.isArray(data.candidates) ? data.candidates : [];
  if (!candidates.length) {
    addModelInfo(model);
    return;
  }

  const candidateTitle = document.createElement("div");
  candidateTitle.className = "result-title";
  candidateTitle.textContent = "可能性排序";
  result.appendChild(candidateTitle);

  const candidateGrid = document.createElement("div");
  candidateGrid.className = "candidate-grid";

  candidates.slice(0, 3).forEach((candidate, idx) => {
    const card = document.createElement("div");
    card.className = "candidate-card";

    const head = document.createElement("div");
    head.className = "candidate-head";

    const name = document.createElement("div");
    name.className = "candidate-name";
    name.textContent = `${candidate.rank || idx + 1}. ${candidate.name || "不明确"}`;

    const likelihood = document.createElement("div");
    likelihood.className = "likelihood";
    likelihood.textContent = candidate.likelihood || "可能";

    const typeTag = document.createElement("div");
    typeTag.className = "type-tag";
    typeTag.textContent = candidate.type || "不明确";

    const tags = document.createElement("div");
    tags.className = "candidate-tags";
    tags.appendChild(typeTag);
    tags.appendChild(likelihood);

    head.appendChild(name);
    head.appendChild(tags);
    card.appendChild(head);

    const evidence = Array.isArray(candidate.evidence) ? candidate.evidence : [];
    const evidenceLabel = document.createElement("div");
    evidenceLabel.className = "candidate-section-label";
    evidenceLabel.textContent = "判断依据";
    card.appendChild(evidenceLabel);

    if (evidence.length) {
      const list = document.createElement("ul");
      list.className = "reason-list";
      evidence.slice(0, 3).forEach((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        list.appendChild(li);
      });
      card.appendChild(list);
    } else {
      const emptyEvidence = document.createElement("div");
      emptyEvidence.className = "caveat";
      emptyEvidence.textContent = "不明确";
      card.appendChild(emptyEvidence);
    }

    const caveatLabel = document.createElement("div");
    caveatLabel.className = "candidate-section-label";
    caveatLabel.textContent = "不符合之处";
    card.appendChild(caveatLabel);

    const caveat = document.createElement("div");
    caveat.className = "caveat";
    if (candidate.caveat) {
      caveat.textContent = candidate.caveat;
    } else {
      caveat.textContent = "未见明显不符";
    }
    card.appendChild(caveat);

    candidateGrid.appendChild(card);
  });

  result.appendChild(candidateGrid);
  addModelInfo(model);
}

function showPreview(dataUrl) {
  previewImg.src = dataUrl;
  previewImg.style.display = "block";
  placeholder.style.display = "none";
  imageDataUrl = dataUrl;
  btnRecognize.disabled = false;
  setResultText("");
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const MAX = 1280;
      let w = img.width, h = img.height;
      if (Math.max(w, h) > MAX) {
        const ratio = MAX / Math.max(w, h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleFile(file) {
  if (!file) return;
  compressImage(file, showPreview);
}

document.getElementById("btn-camera").addEventListener("click", function() {
  cameraInput.click();
});
cameraInput.addEventListener("change", function() {
  handleFile(this.files[0]);
  this.value = "";
});

document.getElementById("btn-gallery").addEventListener("click", function() {
  galleryInput.click();
});
galleryInput.addEventListener("change", function() {
  handleFile(this.files[0]);
  this.value = "";
});

btnRecognize.addEventListener("click", async function() {
  if (!imageDataUrl) return;

  btnRecognize.disabled = true;
  setResultText("");
  showProxyNote("");

  const steps = ["Thinking..."];
  let stepIdx = 0;
  statusEl.textContent = steps[0];
  const timer = setInterval(() => {
    stepIdx = (stepIdx + 1) % steps.length;
    statusEl.textContent = steps[stepIdx];
  }, 1500);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 95000);

  try {
    const resp = await fetch(`${apiBase}/recognize`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageDataUrl }),
      signal: controller.signal
    });
    const rawText = await resp.text();
    if (!resp.ok && window.location.protocol === "https:") {
      throw new Error(`HTTPS 代理尚未部署或未绑定成功（接口返回 ${resp.status}），请先部署 /api/microbe/recognize 代理；临时可访问 http://xyyuan.fun/microbe/ 使用。`);
    }
    let data;
    try {
      data = JSON.parse(rawText);
    } catch (parseErr) {
      throw new Error(rawText || "服务器返回内容无法解析");
    }
    if (data.success) {
      if (data.result) {
        renderResult(data.result, data.model);
      } else {
        setResultText(data.text, data.model);
      }
    } else {
      setResultText("识别失败: " + (data.error || "未知错误"));
    }
  } catch (err) {
    let message = err.name === "AbortError" ? "识别超时，请换一张更清晰或更小的图片重试" : err.message;
    if (window.location.protocol === "https:" && message === "Failed to fetch") {
      message = "HTTPS 代理尚未部署或未绑定成功，浏览器无法从 HTTPS 页面访问当前 HTTP 服务器；临时可访问 http://xyyuan.fun/microbe/ 使用。";
    }
    if (message.includes("HTTPS 代理")) {
      showProxyNote(message);
    }
    setResultText("网络错误: " + message);
  } finally {
    clearTimeout(timeout);
    clearInterval(timer);
    statusEl.textContent = "";
    btnRecognize.disabled = false;
  }
});
</script>

</body>
</html>
